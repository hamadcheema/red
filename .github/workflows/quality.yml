name: Repository quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website and admin Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check admin/connection.js
          node --check admin/features.js
          node --check admin/control-center.js
          node --check admin/worker.js
          node --check admin/tests/worker.test.mjs
          node --check admin/tests/control-center.test.mjs
      - name: Run Worker regression tests
        run: node --test admin/tests/*.test.mjs
      - name: Validate HTML, links, assets, metadata and sitemap
        run: python scripts/validate_site.py
